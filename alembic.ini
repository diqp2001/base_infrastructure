# Alembic — schema migrations of the application database (SQL Server base_infra, or SQLite).
# Migration scripts live in the infrastructure layer: src/infrastructure/database/migrations/.
# No database URL here: env.py resolves it (see docs/development/DATABASE_MIGRATIONS.md):
#   1. alembic -x url=<SQLAlchemy URL> ...          e.g. -x url=sqlite:///C:/tmp/scratch.db
#   2. DATABASE_URL environment variable            a migration-only override
#   3. the application's SQL Server settings        src/infrastructure/database/settings.py (DB_* variables,
#                                                   default: Windows localhost base_infra)

[alembic]
script_location = %(here)s/src/infrastructure/database/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 60

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
