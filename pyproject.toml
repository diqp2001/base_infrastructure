[[tool.importlinter.contracts]]
name = "Only the interfaces layer imports the interfaces layer"
type = "forbidden"
source_modules = ["src.domain", "src.application", "src.infrastructure"]
forbidden_modules = ["src.interfaces"]
allow_indirect_imports = true
ignore_imports = [
    # known debt (2026-10-14)
