{# Factor Analysis section shared by every project results page. Include with `fa_source` set, e.g.
   {% set fa_source = 'stm:' ~ project %}{% include "_factor_analysis_section.html" %} #}
<details class="card mb-4" id="factor-analysis" ontoggle="if(this.open){var f=this.querySelector('iframe');if(!f.src){f.src=f.dataset.src;}}"
         style="background:#161b22;border:1px solid #30363d">
    <summary class="card-header" style="background:#21262d;cursor:pointer">Factor Analysis
        <span class="small" style="color:#8b949e">— CAPM / Fama-French / custom regression of this project's returns</span></summary>
    <div class="card-body p-0">
        <iframe data-src="/factor-analysis/?source={{ fa_source|urlencode }}&embedded=1" title="Factor analysis"
                style="width:100%;height:1400px;border:0;background:#0d1117"></iframe>
        <div class="small p-2"><a href="/factor-analysis/?source={{ fa_source|urlencode }}" target="_blank">Open in its own page</a></div>
    </div>
</details>
