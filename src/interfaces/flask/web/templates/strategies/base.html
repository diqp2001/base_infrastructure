<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Strategies{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; color: #212529; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        a { color: #1f5fb4; }
        .card { background: #ffffff; border: 1px solid #e6e8eb; }
        .card-header { background: #f8f9fb; border-bottom: 1px solid #e6e8eb; font-weight: 600; }
        .table { color: #212529; font-size: 0.85rem; }
        .table > :not(caption) > * > * { background: transparent; color: #212529; border-color: #e6e8eb; }
        .form-control, .form-select { background: #f4f5f7; color: #212529; border-color: #e6e8eb; }
        .form-control:focus, .form-select:focus { background: #f4f5f7; color: #212529; }
        .muted { color: #6c757d; }
        .badge-draft { background: #6e7681; } .badge-validated { background: #1f6feb; }
        .badge-locked { background: #238636; } .badge-archived { background: #484f58; }
        .badge-queued { background: #6e7681; } .badge-running { background: #1f6feb; }
        .badge-succeeded { background: #238636; } .badge-failed { background: #da3633; }
        .badge-interrupted { background: #9e6a03; }
        pre.log { background: #f8f9fb; color: #6c757d; max-height: 420px; overflow: auto; font-size: 0.75rem; }
        img.figure { max-width: 100%; background: #fff; border-radius: 4px; }
        code { color: #b54708; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
<nav class="navbar navbar-dark hub-nav">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('strategies.dashboard') }}">Strategy experiments</a>
        <div>
            <a class="btn btn-sm btn-success" href="{{ url_for('strategies.new') }}">New strategy</a>
            <a class="btn btn-sm btn-outline-secondary" href="/">Home</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
