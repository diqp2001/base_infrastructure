<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Monitoring{% endblock %} · base_infrastructure</title>
  <link rel="stylesheet" href="{{ url_for('monitor.static', filename='monitor.css') }}">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">base_infrastructure <small>monitoring</small></div>
    <span class="ro-badge" title="This site only reads data. It cannot trade or change anything.">read-only · {{ environment }}</span>
  </div>
  <nav class="tabs" aria-label="Sections">
    {% for name, path, title in pages %}
      <a href="{{ url_for('monitor.page_' ~ name) }}" class="{{ 'active' if name == active else '' }}">{{ title }}</a>
    {% endfor %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>Read-only monitoring · {{ version }} · no trading, no configuration changes</footer>
<script src="{{ url_for('monitor.static', filename='monitor.js') }}"></script>
</body>
</html>
